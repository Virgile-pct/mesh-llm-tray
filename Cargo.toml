[package]
name = "mesh-llm-tray"
version = "0.2.0"
edition = "2024"
description = "Windows notification-area icon for a local MeshLLM node: status, console, start and stop"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tray-icon = "0.25"
tao = "0.37"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
